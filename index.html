<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PT CPE - Inventory & Purchasing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #0A0F1A;
    --surface: #121A2B;
    --surface2: #182338;
    --border: #243050;
    --text: #E7ECF3;
    --muted: #8896AC;
    --accent: #2DD4C4;
    --accent-dim: #173B39;
    --warn: #E3A73A;
    --good: #3FBF7F;
    --danger: #E2635F;
    --info: #5B8DEF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 248px; flex-shrink: 0; border-right: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; padding: 0 4px; }
  .logo { width: 36px; height: 36px; border-radius: 8px; background: var(--accent); color: #062421; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
  .brand-name { font-size: 13.5px; font-weight: 600; line-height: 1.2; }
  .brand-sub { font-size: 11px; color: var(--muted); line-height: 1.2; }
  .nav-section { font-size: 10.5px; font-weight: 600; letter-spacing: 0.03em; color: var(--muted); padding: 16px 10px 6px; }
  .nav-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; margin-bottom: 2px; background: transparent; border: none; cursor: pointer; color: var(--text); font-size: 13.5px; font-weight: 500; font-family: inherit; text-align: left; }
  .nav-item:hover { background: var(--surface2); }
  .nav-item.active { background: var(--accent-dim); color: var(--accent); }
  .nav-icon { width: 16px; height: 16px; display: flex; flex-shrink: 0; }
  .nav-icon svg { width: 16px; height: 16px; }
  .nav-label { flex: 1; }
  .nav-badge { font-size: 10.5px; font-weight: 600; border-radius: 999px; padding: 1px 6px; background: var(--surface2); color: var(--muted); }
  .nav-item.active .nav-badge { background: var(--accent); color: #062421; }
  .sidebar-footer { font-size: 11.5px; line-height: 1.5; color: var(--muted); padding: 0 4px; }
  .main { flex: 1; min-width: 0; padding: 32px; }
  .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  #pageTitle { font-size: 22px; font-weight: 600; margin: 0; }
  #pageSub { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
  .loading, .error, .empty { padding: 32px; text-align: center; color: var(--muted); font-size: 13px; }
  .error { color: var(--danger); }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  .p4 { padding: 16px; }
  .p20 { padding: 20px; }
  .b-top { border-top: 1px solid var(--border); }
  .b-bottom { border-bottom: 1px solid var(--border); }
  .py2 { padding-top: 8px; padding-bottom: 8px; }
  .mb3 { margin-bottom: 14px; }
  .grid-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
  .card { padding: 16px; }
  .card-value { font-size: 24px; font-weight: 600; margin-top: 6px; }
  .card-value.warn { color: var(--warn); }
  .card-value.good { color: var(--good); }
  .card-value.info { color: var(--info); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-2-info { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .panel-title { font-size: 14.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; margin: 0; }
  .panel-title svg { width: 15px; height: 15px; color: var(--warn); }
  .row-between { display: flex; align-items: center; justify-content: space-between; }
  .row-gap { display: flex; align-items: center; gap: 10px; }
  .link-btn { background: none; border: none; color: var(--accent); font-size: 12.5px; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 3px; }
  .icon-sm { width: 14px; height: 14px; display: flex; }
  .icon-sm svg { width: 14px; height: 14px; }
  .icon-sm.good { color: var(--good); }
  .icon-sm.danger { color: var(--danger); }
  .icon-sm.muted { color: var(--muted); }
  .fw-medium { font-weight: 500; }
  .tiny { font-size: 11.5px; }
  .small { font-size: 13px; }
  .muted { color: var(--muted); }
  .warn { color: var(--warn); }
  .good { color: var(--good); }
  .danger { color: var(--danger); }
  .accent { color: var(--accent); }
  .section-label { font-size: 12px; font-weight: 500; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.02em; }
  .total-row { padding-top: 12px; margin-top: 4px; border-top: 1px solid var(--border); font-size: 14px; font-weight: 600; }
  .search-box { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; max-width: 420px; }
  .search-box.search-narrow { max-width: 320px; }
  .search-box svg { width: 15px; height: 15px; color: var(--muted); flex-shrink: 0; }
  .search-box input { background: transparent; border: none; outline: none; color: var(--text); font-size: 13.5px; font-family: inherit; flex: 1; width: 100%; }
  .table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .table th { text-align: left; font-weight: 500; font-size: 11.5px; color: var(--muted); padding: 10px 16px; }
  .table td { padding: 12px 16px; border-top: 1px solid var(--border); vertical-align: top; }
  .status-dot { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
  .status-dot .dot { width: 6px; height: 6px; border-radius: 50%; }
  .status-dot.warn { color: var(--warn); } .status-dot.warn .dot { background: var(--warn); }
  .status-dot.good { color: var(--good); } .status-dot.good .dot { background: var(--good); }
  .status-dot.danger { color: var(--danger); } .status-dot.danger .dot { background: var(--danger); }
  .status-dot.muted { color: var(--muted); } .status-dot.muted .dot { background: var(--muted); }
  .status-dot.info { color: var(--info); } .status-dot.info .dot { background: var(--info); }
  .btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; font-weight: 500; font-size: 13.5px; font-family: inherit; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
  .btn svg { width: 15px; height: 15px; }
  .btn-sm { padding: 6px 10px; font-size: 12.5px; }
  .btn-sm svg { width: 13px; height: 13px; }
  .btn-solid { background: var(--accent); color: #062421; border: none; }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid #3A1E1E; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(4,7,14,0.65); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; width: 100%; max-height: 85vh; overflow-y: auto; }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); }
  .modal-header h3 { font-size: 15px; font-weight: 600; margin: 0; }
  .icon-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; display: flex; }
  .icon-btn svg { width: 18px; height: 18px; }
  .modal-body { padding: 20px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  .field { margin-bottom: 14px; display: block; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 8px 10px; font-size: 13.5px; font-family: inherit; outline: none; }
  .error-text { font-size: 12.5px; color: var(--danger); margin-bottom: 12px; }
  .toast { position: fixed; bottom: 24px; right: 24px; z-index: 60; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 12px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.35); max-width: 360px; }
  .hidden { display: none !important; }
  @media (max-width: 900px) { .grid-cards { grid-template-columns: 1fr 1fr; } .grid-2 { grid-template-columns: 1fr; } }
</style>
</head>

      <div class="brand">
        <div class="logo">CPE</div>
        <div>
          <div class="brand-name">PT CPE</div>
          <div class="brand-sub">Inventory &amp; Purchasing</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-footer">Data tersimpan di Supabase, bisa diakses tim dari mana saja.</div>
    </aside>
    <main class="main">

    </main>
  </div>
  <div id="modalRoot"></div>
  <div id="toast" class="toast hidden"></div>

async function nextPrNumber() {
  const { data, error } = await sb.from('purchase_requests').select('id');
  if (error) throw error;
  let max = 0;
  (data || []).forEach((r) => {
    if (/^\d+$/.test(r.id)) {
      const n = parseInt(r.id, 10);
      if (n > max) max = n;
    }
  });
  return String(max + 1).padStart(5, '0');
}

async function nextPoNumber(deptCode) {
  const { data, error } = await sb.from('purchase_orders').select('id').ilike('id', deptCode + '%').order('id', { ascending: false }).limit(50);
  if (error) throw error;
  let nextNum = 1;
  if (data && data.length) {
    const nums = data
      .map((r) => r.id.slice(deptCode.length))
      .map((s) => parseInt(s, 10))
      .filter((n) => !isNaN(n));
    if (nums.length) nextNum = Math.max(...nums) + 1;
  }
  return deptCode + String(nextNum).padStart(5, '0');
}

function mapPart(p) {
  return { Kode: p.kode, Nama: p.nama, Kategori: p.kategori, Lokasi: p.lokasi, Satuan: p.satuan,
    Stok: Number(p.stok), MinStok: Number(p.min_stok), Harga: Number(p.harga), StatusKatalog: p.status_katalog };
}
function mapSupplier(s) { return { ID: s.id, Nama: s.nama, Kontak: s.kontak, Telepon: s.telepon, Kategori: s.kategori, Alamat: s.alamat }; }
function mapPR(r) {
  return { ID: r.id, Tanggal: r.tanggal, DimintaOleh: r.diminta_oleh, Jabatan: r.jabatan, Departemen: r.departemen,
    EquipmentNumber: r.equipment_number, Keterangan: r.keterangan, Status: r.status, SignedFileUrl: r.signed_file_url,
    Items: (r.purchase_request_items || []).map((it) => ({ kode: it.part_kode, namaItem: it.nama_item, satuan: it.satuan, qty: Number(it.qty) })) };
}
function mapPO(r) {
  return { ID: r.id, Supplier: r.supplier, Tanggal: r.tanggal, Status: r.status,
    DueDate: r.due_date, DistrictWh: r.district_wh, DeliveryPlace: r.delivery_place,
    QuotationNo: r.quotation_no, Discount: Number(r.discount || 0), PpnPercent: Number(r.ppn_percent || 11),
    Notes: r.notes, AuthorizedPerson: r.authorized_person, ReqDept: r.req_dept, SignedFileUrl: r.signed_file_url,
    Items: (r.purchase_order_items || []).map((it) => ({ kode: it.part_kode, qty: Number(it.qty), harga: Number(it.harga) })) };
}
function mapPGR(r) {
  return { ID: r.id, PO: r.po_id, Supplier: r.supplier, Tanggal: r.tanggal, Status: r.status,
    Items: (r.penerimaan_items || []).map((it) => ({ kode: it.part_kode, qty: Number(it.qty) })) };
}
function mapLedger(l) { return { Kode: l.part_kode, Tanggal: l.tanggal, Tipe: l.tipe, Qty: Number(l.qty), Ref: l.ref, Saldo: Number(l.saldo) }; }

async function loadData() {
  try {
    const [partsRes, suppliersRes, prRes, poRes, pgrRes, ledgerRes] = await Promise.all([
      sb.from('parts').select('*').order('kode'),
      sb.from('suppliers').select('*').order('id'),
      sb.from('purchase_requests').select('*, purchase_request_items(*)').order('created_at', { ascending: false }),
      sb.from('purchase_orders').select('*, purchase_order_items(*)').order('created_at', { ascending: false }),
      sb.from('penerimaan').select('*, penerimaan_items(*)').order('id', { ascending: false }),
      sb.from('ledger').select('*').order('tanggal', { ascending: false }),
    ]);
    [partsRes, suppliersRes, prRes, poRes, pgrRes, ledgerRes].forEach((r) => { if (r.error) throw r.error; });
    STATE = {
      parts: partsRes.data.map(mapPart),
      suppliers: suppliersRes.data.map(mapSupplier),
      pr: prRes.data.map(mapPR),
      po: poRes.data.map(mapPO),
      penerimaan: pgrRes.data.map(mapPGR),
      ledger: ledgerRes.data.map(mapLedger),
    };
    normalizeState();
    renderNav();
    renderPage();
  } catch (err) {
    document.getElementById('content').innerHTML =
      '<div class="error">Gagal memuat data dari Supabase: ' + escapeHtml(err.message || String(err)) + '</div>';
  }
}

function normalizeState() {
  STATE.parts.forEach((p) => {
    p.Status = p.StatusKatalog === 'Perlu Ditinjau' ? 'Perlu Ditinjau' : (p.Stok <= p.MinStok ? 'Menipis' : 'Aman');
  });
}

function computeBadges() {
  return {
    pr: STATE.pr.filter((p) => p.Status === 'Menunggu').length,
    po: STATE.po.filter((p) => p.Status !== 'Diterima').length,
    penerimaan: STATE.penerimaan.filter((p) => p.Status === 'Menunggu').length,
    stock: STATE.parts.filter((p) => p.Status === 'Menipis').length,
    katalog: STATE.parts.filter((p) => p.StatusKatalog === 'Perlu Ditinjau').length,
  };
}

/* ================= HELPERS ================= */
function rp(n) { return 'Rp' + Math.round(n).toLocaleString('id-ID'); }
function todayStr() { const d = new Date(); return d.toISOString().slice(0, 10); }
function fmtDate(d) { const dt = new Date(d); if (isNaN(dt.getTime())) return d; return dt.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function genId(prefix) { const year = new Date().getFullYear(); const rand = Math.random().toString(16).slice(2, 6).toUpperCase(); return prefix + '-' + year + '-' + rand; }
function statusToneClass(status) {
  if (status === 'Menunggu') return 'warn';
  if (['Disetujui', 'Diterima', 'Aman', 'Masuk', 'Terverifikasi'].includes(status)) return 'good';
  if (['Ditolak', 'Keluar'].includes(status)) return 'danger';
  if (status === 'Perlu Ditinjau') return 'info';
  return 'muted';
}
function statusDot(status) { return '<span class="status-dot ' + statusToneClass(status) + '"><span class="dot"></span>' + escapeHtml(status) + '</span>'; }
function supplierByKategori(kat) { return STATE.suppliers.find((s) => s.Kategori === kat) || STATE.suppliers[0]; }

let toastTimer;
function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderColor = isError ? 'var(--danger)' : 'var(--border)';
  t.style.color = isError ? 'var(--danger)' : 'var(--text)';
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), isError ? 4200 : 2600);
}

function openModal(title, bodyHtml, width) {
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this) closeModal()">' +
    '<div class="modal" style="max-width:' + (width || 560) + 'px" onclick="event.stopPropagation()">' +
    '<div class="modal-header"><h3>' + title + '</h3><button class="icon-btn" onclick="closeModal()">' + ICONS.x + '</button></div>' +
    '<div class="modal-body">' + bodyHtml + '</div></div></div>';
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

/* ================= NAV / ROUTING ================= */
function go(id) { currentPage = id; renderNav(); renderPage(); }

function renderNav() {
  const badges = computeBadges();
  document.getElementById('nav').innerHTML = NAV.map((n) => {
    if (n.section) return '<div class="nav-section">' + n.section + '</div>';
    const active = currentPage === n.id;
    const badge = n.badgeKey ? badges[n.badgeKey] : 0;
    return '<button class="nav-item ' + (active ? 'active' : '') + '" onclick="go(\'' + n.id + '\')">' +
      '<span class="nav-icon">' + ICONS[n.icon] + '</span><span class="nav-label">' + n.label + '</span>' +
      (badge ? '<span class="nav-badge">' + badge + '</span>' : '') + '</button>';
  }).join('');
}

function actionButton(icon, label, onclick) { return '<button class="btn btn-solid" onclick="' + onclick + '">' + ICONS[icon] + '<span>' + label + '</span></button>'; }

function renderPage() {
  document.getElementById('pageTitle').textContent = TITLES[currentPage][0];
  document.getElementById('pageSub').textContent = TITLES[currentPage][1];
  const action = document.getElementById('pageAction');
  action.innerHTML = '';
  if (currentPage === 'stock') action.innerHTML = actionButton('upload', 'Keluarkan Stock', 'openKeluarModal()');
  if (currentPage === 'pr') action.innerHTML = actionButton('plus', 'Buat PR', 'openBuatPRModal()');
  const content = document.getElementById('content');
  if (currentPage === 'dashboard') content.innerHTML = renderDashboard();
  else if (currentPage === 'pr') content.innerHTML = renderPRPage();
  else if (currentPage === 'po') content.innerHTML = renderPOPage();
  else if (currentPage === 'penerimaan') content.innerHTML = renderPenerimaanPage();
  else if (currentPage === 'stock') content.innerHTML = renderStockPage();
  else if (currentPage === 'katalog') content.innerHTML = renderKatalogPage();
  else if (currentPage === 'supplier') content.innerHTML = renderSupplierPage();
}

/* ================= DASHBOARD ================= */
function renderDashboard() {
  const b = computeBadges();
  const totalNilai = STATE.parts.reduce((s, p) => s + p.Stok * p.Harga, 0);
  const cards = [
    { label: 'Jenis Part Tercatat', value: STATE.parts.length, sub: 'master data aktif' },
    { label: 'Nilai Total Stok', value: rp(totalNilai), sub: 'estimasi harga beli' },
    { label: 'Part Stok Menipis', value: b.stock, sub: 'perlu pengajuan PR', tone: b.stock > 0 ? 'warn' : 'good' },
    { label: 'PR Menunggu Persetujuan', value: b.pr, sub: 'dari departemen' },
    { label: 'PO Sedang Berjalan', value: b.po, sub: 'belum diterima gudang' },
    { label: 'Penerimaan Menunggu', value: b.penerimaan, sub: 'belum dikonfirmasi' },
    { label: 'Part Perlu Ditinjau', value: b.katalog, sub: 'PN baru dari PR, belum diverifikasi', tone: b.katalog > 0 ? 'info' : 'good' },
  ];
  const cardHtml = cards.map((c) => '<div class="panel card"><div class="tiny muted">' + c.label + '</div>' +
    '<div class="card-value mono ' + (c.tone || '') + '">' + c.value + '</div><div class="tiny muted">' + c.sub + '</div></div>').join('');

  const lowStock = STATE.parts.filter((p) => p.Status === 'Menipis').slice(0, 5);
  const lowStockHtml = lowStock.length ? lowStock.map((p) =>
    '<div class="row-between b-top py2"><div><div class="fw-medium">' + escapeHtml(p.Nama) + '</div>' +
    '<div class="tiny muted mono">' + p.Kode + ' · ' + escapeHtml(p.Lokasi || '') + '</div></div>' +
    '<div class="mono warn">' + p.Stok + ' / ' + p.MinStok + ' ' + escapeHtml(p.Satuan || '') + '</div></div>'
  ).join('') : '<div class="tiny muted">Tidak ada part yang menipis.</div>';

  const recent = STATE.ledger.slice().sort((a, b) => (a.Tanggal < b.Tanggal ? 1 : -1)).slice(0, 6);
  const recentHtml = recent.map((r) => {
    const part = STATE.parts.find((p) => p.Kode === r.Kode);
    const icon = r.Tipe === 'Masuk' ? ICONS.inbox : r.Tipe === 'Keluar' ? ICONS.upload : ICONS.check;
    const tone = r.Tipe === 'Masuk' ? 'good' : r.Tipe === 'Keluar' ? 'danger' : 'muted';
    return '<div class="row-between b-top py2"><div class="row-gap"><span class="icon-sm ' + tone + '">' + icon + '</span>' +
      '<div><div class="fw-medium small">' + (part ? escapeHtml(part.Nama) : r.Kode) + '</div>' +
      '<div class="tiny muted">' + r.Tipe + ' · ' + fmtDate(r.Tanggal) + '</div></div></div>' +
      '<div class="mono small">' + (r.Tipe === 'Keluar' ? '-' : '+') + r.Qty + '</div></div>';
  }).join('');

  return '<div class="grid-cards">' + cardHtml + '</div><div class="grid-2">' +
    '<div class="panel p20"><div class="row-between mb3"><h3 class="panel-title">' + ICONS.alert + ' Part Perlu Perhatian</h3>' +
    '<button class="link-btn" onclick="go(\'stock\')">Lihat semua ›</button></div>' + lowStockHtml + '</div>' +
    '<div class="panel p20"><h3 class="panel-title mb3">Aktivitas Stok Terbaru</h3>' + recentHtml + '</div></div>';
}

/* ================= STOCK / INVENTORY ================= */
function renderStockPage() {
  return '<div class="panel"><div class="p4 b-bottom"><div class="search-box">' + ICONS.search +
    '<input id="stockSearch" type="text" placeholder="Cari part, kategori, atau kode..." oninput="renderStockTable()"></div></div>' +
    '<div id="stockTableWrap">' + renderStockTable(true) + '</div></div>';
}
function renderStockTable(returnOnly) {
  const q = (document.getElementById('stockSearch') && document.getElementById('stockSearch').value || '').toLowerCase();
  const filtered = STATE.parts.filter((p) => (p.Kode + ' ' + p.Nama + ' ' + (p.Kategori || '')).toLowerCase().includes(q));
  const rows = filtered.map((p) => '<tr class="b-top"><td class="mono accent">' + p.Kode + '</td>' +
    '<td class="fw-medium">' + escapeHtml(p.Nama) + '</td><td class="muted">' + escapeHtml(p.Kategori || '-') + '</td>' +
    '<td class="muted">' + escapeHtml(p.Lokasi || '-') + '</td><td class="mono">' + p.Stok + ' ' + escapeHtml(p.Satuan || '') + '</td>' +
    '<td class="mono muted">' + p.MinStok + ' ' + escapeHtml(p.Satuan || '') + '</td><td class="mono">' + rp(p.Stok * p.Harga) + '</td>' +
    '<td>' + statusDot(p.Status) + '</td><td><button class="btn btn-ghost btn-sm" onclick="openKartuModal(\'' + p.Kode + '\')">Kartu Stock</button></td></tr>'
  ).join('');
  const table = '<table class="table"><thead><tr>' +
    ['Kode', 'Nama Part', 'Kategori', 'Lokasi', 'Stok', 'Min. Stok', 'Nilai Stok', 'Status', ''].map((h) => '<th>' + h + '</th>').join('') +
    '</tr></thead><tbody>' + (rows || '<tr><td colspan="9" class="empty">Tidak ada part yang cocok.</td></tr>') + '</tbody></table>';
  if (returnOnly) return table;
  document.getElementById('stockTableWrap').innerHTML = table;
}

function openKeluarModal() {
  const options = STATE.parts.map((p) => '<option value="' + p.Kode + '">' + p.Kode + ' — ' + escapeHtml(p.Nama) + ' (stok: ' + p.Stok + ' ' + escapeHtml(p.Satuan || '') + ')</option>').join('');
  const body = '<div class="field"><label>Part</label><select id="keluarKode" onchange="updateKeluarError()">' + options + '</select></div>' +
    '<div class="field"><label>Jumlah</label><input id="keluarQty" type="number" min="1" value="1" oninput="updateKeluarError()"></div>' +
    '<div class="field"><label>Tujuan Pengeluaran</label><input id="keluarTujuan" type="text" placeholder="mis. Workshop - perbaikan unit BX-12"></div>' +
    '<div id="keluarError" class="error-text hidden"></div>' +
    '<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Batal</button>' +
    '<button class="btn btn-solid" id="keluarSubmit" onclick="submitKeluar()">Keluarkan Stock</button></div>';
  openModal('Keluarkan Stock', body);
  updateKeluarError();
}
function updateKeluarError() {
  const kode = document.getElementById('keluarKode').value;
  const qty = Number(document.getElementById('keluarQty').value);
  const part = STATE.parts.find((p) => p.Kode === kode);
  const errBox = document.getElementById('keluarError');
  const submitBtn = document.getElementById('keluarSubmit');
  if (qty > part.Stok) {
    errBox.textContent = 'Stok ' + part.Nama + ' hanya tersedia ' + part.Stok + ' ' + part.Satuan + '.';
    errBox.classList.remove('hidden'); submitBtn.disabled = true;
  } else { errBox.classList.add('hidden'); submitBtn.disabled = qty <= 0; }
}
async function submitKeluar() {
  const kode = document.getElementById('keluarKode').value;
  const qty = Number(document.getElementById('keluarQty').value);
  const tujuan = document.getElementById('keluarTujuan').value;
  const btn = document.getElementById('keluarSubmit');
  btn.disabled = true; btn.textContent = 'Memproses...';
  try {
    const part = STATE.parts.find((p) => p.Kode === kode);
    if (qty > part.Stok) throw new Error('Stok tidak mencukupi.');
    const newStok = part.Stok - qty;
    let { error } = await sb.from('parts').update({ stok: newStok }).eq('kode', kode);
    if (error) throw error;
    ({ error } = await sb.from('ledger').insert({ part_kode: kode, tanggal: todayStr(), tipe: 'Keluar', qty, ref: tujuan || '-', saldo: newStok }));
    if (error) throw error;
    await loadData();
    closeModal();
    showToast(qty + ' unit ' + kode + ' dikeluarkan dari stok.');
  } catch (err) {
    showToast('Gagal: ' + (err.message || err), true);
    btn.disabled = false; btn.textContent = 'Keluarkan Stock';
  }
}

function openKartuModal(kode) {
  const part = STATE.parts.find((p) => p.Kode === kode);
  const entries = STATE.ledger.filter((l) => l.Kode === kode);
  const rows = entries.map((e) => '<tr class="b-top"><td>' + fmtDate(e.Tanggal) + '</td><td>' + statusDot(e.Tipe) + '</td>' +
    '<td class="mono">' + (e.Tipe === 'Keluar' ? '-' : '+') + e.Qty + ' ' + escapeHtml(part.Satuan || '') + '</td>' +
    '<td class="muted">' + escapeHtml(String(e.Ref || '-')) + '</td><td class="mono fw-medium">' + e.Saldo + ' ' + escapeHtml(part.Satuan || '') + '</td></tr>').join('');
  const body = '<div class="row-gap tiny muted mb3"><span class="mono">' + part.Kode + '</span><span>' + escapeHtml(part.Kategori || '-') + '</span><span>' + escapeHtml(part.Lokasi || '-') + '</span></div>' +
    '<table class="table"><thead><tr>' + ['Tanggal', 'Tipe', 'Jumlah', 'Referensi', 'Saldo'].map((h) => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' + rows + '</tbody></table>';
  openModal('Kartu Stock — ' + escapeHtml(part.Nama), body);
}

/* ================= KATALOG PART ================= */
function renderKatalogPage() {
  return '<div class="panel"><div class="p4 b-bottom row-between">' +
    '<div class="search-box search-narrow">' + ICONS.search + '<input id="katalogSearch" type="text" placeholder="Cari part..." oninput="renderKatalogTable()"></div>' +
    '<label class="tiny muted row-gap" style="cursor:pointer;"><input type="checkbox" id="katalogFilterReview" onchange="renderKatalogTable()" style="margin-right:6px;">Tampilkan Perlu Ditinjau saja</label></div>' +
    '<div id="katalogTableWrap">' + renderKatalogTable(true) + '</div></div>';
}
function renderKatalogTable(returnOnly) {
  const q = (document.getElementById('katalogSearch') && document.getElementById('katalogSearch').value || '').toLowerCase();
  const onlyReview = document.getElementById('katalogFilterReview') && document.getElementById('katalogFilterReview').checked;
  let filtered = STATE.parts.filter((p) => (p.Kode + ' ' + p.Nama + ' ' + (p.Kategori || '')).toLowerCase().includes(q));
  if (onlyReview) filtered = filtered.filter((p) => p.StatusKatalog === 'Perlu Ditinjau');
  const rows = filtered.map((p) => {
    const sup = p.Kategori ? supplierByKategori(p.Kategori) : null;
    return '<tr class="b-top"><td class="mono accent">' + p.Kode + '</td><td class="fw-medium">' + escapeHtml(p.Nama) + '</td>' +
      '<td class="muted">' + escapeHtml(p.Kategori || '-') + '</td><td>' + escapeHtml(p.Satuan || '-') + '</td>' +
      '<td>' + (sup ? escapeHtml(sup.Nama) : '-') + '</td><td class="mono">' + rp(p.Harga) + '</td>' +
      '<td>' + statusDot(p.StatusKatalog || 'Terverifikasi') + '</td>' +
      '<td><button class="btn btn-ghost btn-sm" onclick="openEditPartModal(\'' + p.Kode + '\')">Edit</button></td></tr>';
  }).join('');
  const table = '<table class="table"><thead><tr>' +
    ['Kode', 'Nama Part', 'Kategori', 'Satuan', 'Supplier Utama', 'Harga Standar', 'Status Katalog', ''].map((h) => '<th>' + h + '</th>').join('') +
    '</tr></thead><tbody>' + (rows || '<tr><td colspan="8" class="empty">Tidak ada part yang cocok.</td></tr>') + '</tbody></table>';
  if (returnOnly) return table;
  document.getElementById('katalogTableWrap').innerHTML = table;
}
function openEditPartModal(kode) {
  const p = STATE.parts.find((x) => x.Kode === kode);
  const body = '<div class="field"><label>Nama Part</label><input id="editNama" type="text" value="' + escapeHtml(p.Nama) + '"></div>' +
    '<div class="field"><label>Kategori</label><input id="editKategori" type="text" value="' + escapeHtml(p.Kategori || '') + '"></div>' +
    '<div class="field"><label>Lokasi</label><input id="editLokasi" type="text" value="' + escapeHtml(p.Lokasi || '') + '"></div>' +
    '<div class="field"><label>Satuan</label><input id="editSatuan" type="text" value="' + escapeHtml(p.Satuan || '') + '"></div>' +
    '<div class="field"><label>Min. Stok</label><input id="editMinStok" type="number" min="0" value="' + p.MinStok + '"></div>' +
    '<div class="field"><label>Harga Standar</label><input id="editHarga" type="number" min="0" value="' + p.Harga + '"></div>' +
    '<div class="field"><label>Status Katalog</label><select id="editStatusKatalog">' +
    '<option value="Perlu Ditinjau"' + (p.StatusKatalog === 'Perlu Ditinjau' ? ' selected' : '') + '>Perlu Ditinjau</option>' +
    '<option value="Terverifikasi"' + (p.StatusKatalog === 'Terverifikasi' ? ' selected' : '') + '>Terverifikasi</option></select></div>' +
    '<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Batal</button>' +
    '<button class="btn btn-solid" onclick="submitEditPart(\'' + kode + '\')">Simpan</button></div>';
  openModal('Edit Part — ' + kode, body);
}
async function submitEditPart(kode) {
  try {
    const { error } = await sb.from('parts').update({
      nama: document.getElementById('editNama').value.trim(),
      kategori: document.getElementById('editKategori').value.trim(),
      lokasi: document.getElementById('editLokasi').value.trim(),
      satuan: document.getElementById('editSatuan').value.trim(),
      min_stok: Number(document.getElementById('editMinStok').value),
      harga: Number(document.getElementById('editHarga').value),
      status_katalog: document.getElementById('editStatusKatalog').value,
    }).eq('kode', kode);
    if (error) throw error;
    await loadData();
    closeModal();
    showToast('Part ' + kode + ' berhasil diperbarui.');
  } catch (err) { showToast('Gagal: ' + (err.message || err), true); }
}

/* ================= PURCHASE REQUEST ================= */
function renderPRPage() {
  const rows = STATE.pr.map((pr) => '<tr class="b-top"><td class="mono accent">' + pr.ID + '</td><td>' + fmtDate(pr.Tanggal) + '</td>' +
    '<td class="fw-medium">' + escapeHtml(pr.DimintaOleh || '-') + '</td><td class="muted">' + escapeHtml(pr.Departemen || '-') + '</td>' +

/* ---- Upload dokumen yang sudah ditandatangani (PR & PO) ---- */
async function uploadSignedFile(file, folder, id) {
  const ext = (file.name.split('.').pop() || 'dat').toLowerCase();
  const fileName = folder + '/' + id + '_' + Date.now() + '.' + ext;
  const { error } = await sb.storage.from('signed-documents').upload(fileName, file, { upsert: true, contentType: file.type });
  if (error) throw error;
  const { data } = sb.storage.from('signed-documents').getPublicUrl(fileName);
  return data.publicUrl;
}

async function submitBuatPR() {
  const dimintaInput = document.getElementById('prDiminta');
  const diminta = dimintaInput.value.trim();
  const jabatan = document.getElementById('prJabatan').value.trim();
  const departemen = document.getElementById('prDept').value;
  const equipmentNumber = document.getElementById('prEquipment').value.trim();
  const keterangan = document.getElementById('prKeterangan').value.trim();
  if (!diminta) {
    dimintaInput.style.borderColor = 'var(--danger)'; dimintaInput.scrollIntoView({ block: 'center' }); dimintaInput.focus();
    showToast('Isi dulu Nama Pemohon di bagian atas form.', true); return;
  }
  dimintaInput.style.borderColor = '';
  const rows = document.querySelectorAll('.pr-item-row');
  const items = [];
  for (const row of rows) {
    const idx = row.getAttribute('data-idx');
    const kodeInput = document.getElementById('prKode_' + idx);
    const kode = kodeInput.value.trim().toUpperCase();
    const qty = Number(document.getElementById('prQty_' + idx).value);
    if (!kode || qty <= 0) { kodeInput.style.borderColor = 'var(--danger)'; kodeInput.scrollIntoView({ block: 'center' }); showToast('Lengkapi Part Number dan Qty di semua item.', true); return; }
    const existing = STATE.parts.find((p) => p.Kode.toUpperCase() === kode);
    const namaInput = document.getElementById('prNamaItem_' + idx);
    const satuanInput = document.getElementById('prSatuan_' + idx);
    const namaItem = existing ? existing.Nama : namaInput.value.trim();
    const satuan = existing ? existing.Satuan : satuanInput.value.trim();
    if (!existing && (!namaItem || !satuan)) { namaInput.style.borderColor = 'var(--danger)'; satuanInput.style.borderColor = 'var(--danger)'; namaInput.scrollIntoView({ block: 'center' }); showToast('Part Number ' + kode + ' belum terdaftar — isi juga Nama Item dan Satuan.', true); return; }
    items.push({ kode, qty, namaItem, satuan });
  }
  if (items.length === 0) { showToast('Tambahkan minimal satu item.', true); return; }
  try {
    for (const it of items) await ensurePartExistsClient(it.kode, it.namaItem, it.satuan);
    const prId = await nextPrNumber();
    let { error } = await sb.from('purchase_requests').insert({ id: prId, tanggal: todayStr(), diminta_oleh: diminta, jabatan, departemen, equipment_number: equipmentNumber, keterangan, status: 'Menunggu' });
    if (error) throw error;
    const itemRows = items.map((it) => ({ pr_id: prId, part_kode: it.kode, nama_item: it.namaItem, satuan: it.satuan, qty: it.qty }));
    ({ error } = await sb.from('purchase_request_items').insert(itemRows));
    if (error) throw error;
    await loadData();
    currentPage = 'pr'; renderNav(); renderPage();
    generateAndDownloadPRPdf(prId);
    openModal('✅ PR Berhasil Diajukan', '<div class="small" style="margin-bottom:18px;">PR ' + prId + ' sudah tersimpan di Supabase dan menunggu persetujuan. PDF form sudah ter-download.</div><div class="modal-actions"><button class="btn btn-solid" onclick="closeModal()">OK</button></div>', 420);
  } catch (err) { showToast('Gagal: ' + (err.message || err), true); }
}

/* ---- Generate PDF Purchase Request (form resmi) ---- */
function generateAndDownloadPRPdf(prId) {
  const pr = STATE.pr.find((p) => p.ID === prId);
  if (!pr) { showToast('PR tidak ditemukan untuk PDF.', true); return; }
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const marginX = 14;

    doc.rect(8, 8, pageWidth - 16, pageHeight - 16);

    try { doc.addImage(LOGO_BASE64, 'PNG', pageWidth / 2 - 27, 12, 55, 8); } catch (e) { /* lanjut tanpa logo */ }
    doc.setFontSize(7.5);
    doc.setTextColor(60);
    doc.text(JOB_SITE, pageWidth / 2, 23, { align: 'center' });
    doc.setTextColor(0);

    doc.setFontSize(15);
    doc.setFont(undefined, 'bold');
    doc.text('FORM PURCHASE REQUEST SPAREPART', pageWidth / 2, 32, { align: 'center' });
    doc.setFont(undefined, 'normal');
    doc.line(marginX, 36, pageWidth - marginX, 36);

    doc.setFontSize(9);
    doc.setFont(undefined, 'bold'); doc.text('DATE :', marginX, 42); doc.setFont(undefined, 'normal');
    doc.text(fmtDateLong(pr.Tanggal), marginX + 14, 42);
    doc.setFont(undefined, 'bold'); doc.text('No.', pageWidth - marginX - 20, 42);
    doc.setTextColor(200, 0, 0);
    doc.text(pr.ID, pageWidth - marginX - 12, 42);
    doc.setTextColor(0);
    doc.setFont(undefined, 'normal');
    doc.line(marginX, 45, pageWidth - marginX, 45);

    const totalRows = Math.max(pr.Items.length, 10);
    const body = [];
    for (let i = 0; i < totalRows; i++) {
      const it = pr.Items[i];
      if (it) {
        const part = STATE.parts.find((p) => p.Kode === it.kode);
        body.push([i + 1, (part ? part.Nama : it.namaItem) || '-', it.kode, it.qty,
          pr.EquipmentNumber || '-', pr.Keterangan || '-']);
      } else {
        body.push([i + 1, '', '', '', '', '']);
      }
    }

    doc.autoTable({
      startY: 50,
      head: [['NO', 'NAMA BARANG', 'PART NUMBER', 'QTY', 'UNIT', 'KEPERLUAN']],
      body,
      styles: { fontSize: 8, lineColor: [0, 0, 0], lineWidth: 0.2, halign: 'center', valign: 'middle' },
      headStyles: { fillColor: [30, 30, 30], textColor: 255, fontStyle: 'bold' },
      columnStyles: {
        0: { cellWidth: 10 },
        1: { halign: 'left', cellWidth: 55 },
        2: { cellWidth: 32 },
        3: { cellWidth: 14 },
        4: { cellWidth: 32 },
        5: { halign: 'left', cellWidth: 35 },
      },
      theme: 'grid',
      margin: { left: marginX, right: marginX },
    });

    const signY = doc.lastAutoTable.finalY + 20;
    const col1 = marginX + 8, col2 = pageWidth / 2 - 15, col3 = pageWidth - marginX - 55;
    doc.setFontSize(9);
    doc.text('Dibuat Oleh,', col1, signY - 12);
    doc.text('Diketahui oleh', col2, signY - 12);
    doc.text('Disetujui Oleh,', col3, signY - 12);

    doc.setFont(undefined, 'bold');
    doc.text(pr.DimintaOleh || '-', col1, signY, { underline: true });
    doc.text(PR_KNOWN_BY.name, col2, signY);
    doc.text(PR_APPROVED_BY.name, col3, signY);
    doc.setFont(undefined, 'normal');
    doc.line(col1, signY + 1, col1 + doc.getTextWidth(pr.DimintaOleh || '-'), signY + 1);
    doc.line(col2, signY + 1, col2 + doc.getTextWidth(PR_KNOWN_BY.name), signY + 1);
    doc.line(col3, signY + 1, col3 + doc.getTextWidth(PR_APPROVED_BY.name), signY + 1);

    doc.setFontSize(8.5);
    doc.text(pr.Jabatan || '-', col1, signY + 5);
    doc.text(PR_KNOWN_BY.title, col2, signY + 5);
    doc.text(PR_APPROVED_BY.title, col3, signY + 5);

    doc.setFontSize(8);
    doc.text('Warehouse Transfer', marginX, pageHeight - 12);
    doc.text('Page 1 of 1', pageWidth - marginX, pageHeight - 12, { align: 'right' });

    doc.save('PR_' + pr.ID + '.pdf');
  } catch (err) {
    showToast('Gagal membuat PDF PR: ' + (err.message || err), true);
  }
}
function fmtDateLong(d) {
  const dt = new Date(d);
  if (isNaN(dt.getTime())) return d;
  return dt.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
}

    }));
    if (error) throw error;
    const rows = items.map((it) => ({ po_id: poId, part_kode: it.kode, qty: it.qty, harga: it.harga }));
    ({ error } = await sb.from('purchase_order_items').insert(rows));
    if (error) throw error;
    await loadData();
    closeModal();
    currentPage = 'po'; renderNav(); renderPage();
    showToast(id + ' disetujui — PO ' + poId + ' dibuat. Menyiapkan PDF...');
    generateAndDownloadPOPdf(poId);
  } catch (err) { showToast('Gagal: ' + (err.message || err), true); }
}

/* ================= PURCHASE ORDER ================= */
function renderPOPage() {
  const rows = STATE.po.map((po) => {
    const total = po.Items.reduce((s, it) => s + it.qty * it.harga, 0);
    return '<tr class="b-top"><td class="mono accent">' + po.ID + '</td><td class="fw-medium">' + escapeHtml(po.Supplier || '-') + '</td>' +
      '<td>' + fmtDate(po.Tanggal) + '</td><td class="mono">' + rp(total) + '</td><td>' + statusDot(po.Status) + '</td>' +
      '<td class="row-gap"><button class="btn btn-ghost btn-sm" onclick="openPODetail(\'' + po.ID + '\')">Lihat Detail</button>' +
      '<button class="btn btn-ghost btn-sm" onclick="generateAndDownloadPOPdf(\'' + po.ID + '\')">' + ICONS.pdf + 'Cetak PDF</button></td></tr>';
  }).join('');
  return '<div class="panel"><table class="table"><thead><tr>' +
    ['No. PO', 'Supplier', 'Tanggal', 'Total', 'Status', ''].map((h) => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}
function openPODetail(id) {
  const po = STATE.po.find((p) => p.ID === id);
  const total = po.Items.reduce((s, it) => s + it.qty * it.harga, 0);
  const itemsHtml = po.Items.map((it) => {
    const part = STATE.parts.find((p) => p.Kode === it.kode);
    return '<div class="row-between b-top py2"><div><div class="fw-medium">' + (part ? escapeHtml(part.Nama) : it.kode) + '</div>' +
      '<div class="tiny muted mono">' + it.kode + ' · ' + it.qty + ' ' + (part ? escapeHtml(part.Satuan || '') : '') + ' x ' + rp(it.harga) + '</div></div>' +
      '<div class="mono">' + rp(it.qty * it.harga) + '</div></div>';
  }).join('');
  const uploadSection = po.Status === 'Draft'
    ? (po.SignedFileUrl
        ? '<div class="tiny muted section-label" style="margin-top:14px;">Dokumen Ditandatangani</div>' +
          '<a href="' + po.SignedFileUrl + '" target="_blank" rel="noopener" class="link-btn">' + ICONS.file + ' Lihat Dokumen ›</a>' +
          '<div class="modal-actions"><button class="btn btn-solid" onclick="doKirimPO(\'' + po.ID + '\')">' + ICONS.send + 'Kirim ke Supplier</button></div>'
        : '<div class="tiny muted section-label" style="margin-top:14px;">Upload Dokumen Ditandatangani (wajib sebelum Kirim)</div>' +
          '<input type="file" id="poSignedFile_' + po.ID + '" accept="application/pdf,image/*" style="margin-bottom:10px; color: var(--text);">' +
          '<div class="modal-actions"><button class="btn btn-ghost" onclick="submitUploadPOSigned(\'' + po.ID + '\')">' + ICONS.upload + 'Upload Dokumen</button></div>')
    : (po.SignedFileUrl
        ? '<div class="tiny muted section-label" style="margin-top:14px;">Dokumen Ditandatangani</div>' +
          '<a href="' + po.SignedFileUrl + '" target="_blank" rel="noopener" class="link-btn">' + ICONS.file + ' Lihat Dokumen ›</a>'
        : '');
  const body = '<div class="grid-2-info mb3"><div><div class="tiny muted">Supplier</div><div class="fw-medium">' + escapeHtml(po.Supplier || '-') + '</div></div>' +
    '<div><div class="tiny muted">Tanggal</div><div class="fw-medium">' + fmtDate(po.Tanggal) + '</div></div>' +
    '<div><div class="tiny muted">Due Date</div><div class="fw-medium">' + (po.DueDate ? fmtDate(po.DueDate) : '-') + '</div></div>' +
    '<div><div class="tiny muted">District/WH</div><div class="fw-medium">' + escapeHtml(po.DistrictWh || '-') + '</div></div>' +
    '<div><div class="tiny muted">Status</div>' + statusDot(po.Status) + '</div>' +
    '<div><div class="tiny muted">No. Quotation</div><div class="fw-medium">' + escapeHtml(po.QuotationNo || '-') + '</div></div></div>' +
    '<div class="tiny muted section-label">Item Dipesan</div>' + itemsHtml +
    '<div class="row-between total-row"><span>Total</span><span class="mono">' + rp(total) + '</span></div>' +
    (po.Notes ? '<div class="tiny muted section-label" style="margin-top:14px;">Notes</div><div class="small">' + escapeHtml(po.Notes) + '</div>' : '') +
    uploadSection;
  openModal(po.ID, body);
}
async function doKirimPO(id) {
  try {
    const { error } = await sb.from('purchase_orders').update({ status: 'Dikirim' }).eq('id', id);
    if (error) throw error;
    await loadData();
    closeModal();
    showToast(id + ' telah dikirim ke supplier.');
  } catch (err) { showToast('Gagal: ' + (err.message || err), true); }
}

/* ---- Generate PDF PO (client-side, jsPDF) — format resmi perusahaan ---- */
const COMPANY_ADDRESS = 'PT Citra Shipyard 12N, Treasury Tower, Kawasan District 8 LOT 28, Jl. Tulodong Atas 2 No.28,\nRT.5/RW.3, Senayan, Kec. Kby. Baru, Kota Jakarta Selatan, Daerah Khusus Ibukota Jakarta (12190)';

function generateAndDownloadPOPdf(poId) {
  const po = STATE.po.find((p) => p.ID === poId);
  if (!po) { showToast('PO tidak ditemukan untuk PDF.', true); return; }
  try {
    const supplier = STATE.suppliers.find((s) => s.Nama === po.Supplier) || {};
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const pageWidth = doc.internal.pageSize.getWidth();
    const marginX = 14;

    // Header: logo + alamat perusahaan
    try { doc.addImage(LOGO_BASE64, 'PNG', marginX, 10, 55, 8); } catch (e) { /* lanjut tanpa logo kalau gagal */ }
    doc.setFontSize(8);
    doc.setTextColor(60);
    doc.text(doc.splitTextToSize(COMPANY_ADDRESS, pageWidth - marginX * 2), marginX, 24);
    doc.setTextColor(0);
    doc.setDrawColor(0);
    doc.line(marginX, 32, pageWidth - marginX, 32);

    // Judul
    doc.setFontSize(15);
    doc.setFont(undefined, 'bold');
    doc.text('PURCHASE ORDER', pageWidth / 2, 40, { align: 'center' });
    doc.setFont(undefined, 'normal');
    doc.line(marginX, 44, pageWidth - marginX, 44);

    // Baris info: PO NO / DATE / DUE DATE / DISTRICT-WH
    doc.setFontSize(9);
    const infoY = 50;
    doc.setFont(undefined, 'bold'); doc.text('PO NO', marginX, infoY); doc.setFont(undefined, 'normal');
    doc.text(po.ID, marginX + 16, infoY);
    doc.setFont(undefined, 'bold'); doc.text('DATE', marginX + 55, infoY); doc.setFont(undefined, 'normal');
    doc.text(fmtDateShort(po.Tanggal), marginX + 70, infoY);
    doc.setFont(undefined, 'bold'); doc.text('DUE DATE', marginX + 100, infoY); doc.setFont(undefined, 'normal');
    doc.text(fmtDateShort(po.DueDate), marginX + 122, infoY);
    doc.setFont(undefined, 'bold'); doc.text('DISTRICT/WH', marginX + 152, infoY); doc.setFont(undefined, 'normal');
    doc.text(po.DistrictWh || '-', marginX + 178, infoY);
    doc.line(marginX, infoY + 4, pageWidth - marginX, infoY + 4);

    // Supplier (kiri) & Delivery Place (kanan)
    const blockY = infoY + 12;
    doc.setFont(undefined, 'bold');
    doc.text(String(po.Supplier || '-').toUpperCase(), marginX, blockY);
    doc.setFont(undefined, 'normal');
    const supAddrLines = doc.splitTextToSize(supplier.Alamat || '-', 90);
    doc.text(supAddrLines, marginX, blockY + 5);
    let afterAddrY = blockY + 5 + supAddrLines.length * 4;
    doc.text('ATTN : ' + (supplier.Telepon || '-'), marginX, afterAddrY + 2);

    doc.setFont(undefined, 'bold');
    doc.text('DELIVERY PLACE :', 115, blockY);
    doc.setFont(undefined, 'normal');
    const deliveryLines = doc.splitTextToSize(po.DeliveryPlace || '-', 85);
    doc.text(deliveryLines, 115, blockY + 5);

    const tableStartY = Math.max(afterAddrY + 10, blockY + 5 + deliveryLines.length * 4 + 6);

    // Tabel item
    const rows = po.Items.map((it, i) => {
      const part = STATE.parts.find((p) => p.Kode === it.kode) || {};
      return [i + 1, part.Nama || it.kode, it.kode, it.qty + ' ' + (part.Satuan || ''), rp(it.harga), rp(it.qty * it.harga)];
    });
    doc.autoTable({
      startY: tableStartY,
      head: [['NO', 'ITEM NAME/DESCRIPTION', 'PART NUMBER', 'UOP', 'UNIT PRICE', 'TOTAL PRICE']],
      body: rows,
      styles: { fontSize: 8.5, lineColor: [0, 0, 0], lineWidth: 0.2 },
      headStyles: { fillColor: [91, 141, 239], textColor: 255, fontStyle: 'bold' },
      columnStyles: { 0: { cellWidth: 10 }, 4: { halign: 'right' }, 5: { halign: 'right' } },
      theme: 'grid',
    });

    const subTotal = po.Items.reduce((s, it) => s + it.qty * it.harga, 0);
    const discount = po.Discount || 0;
    const net = subTotal - discount;
    const ppn = net * ((po.PpnPercent || 11) / 100);
    const total = net + ppn;

    const afterTableY = doc.lastAutoTable.finalY + 6;

    // Kiri: kode internal, quotation, req dept, note box
    doc.setFontSize(8.5);
    doc.text('PO_CPE_' + (po.DistrictWh || '-').toUpperCase(), marginX, afterTableY);
    doc.text('QUO ' + (po.QuotationNo || '-'), marginX, afterTableY + 4.5);
    doc.text('REQ DEPT ' + (po.ReqDept || '-'), marginX, afterTableY + 9);

    doc.setDrawColor(150);
    doc.rect(marginX, afterTableY + 13, 75, 18);
    doc.setFont(undefined, 'bold');
    doc.text('Note:', marginX + 2, afterTableY + 18);
    doc.setFont(undefined, 'normal');
    doc.text(doc.splitTextToSize(po.Notes || '-', 70), marginX + 2, afterTableY + 23);

    // Kanan: breakdown total
    const totalsX = 120;
    const totalsLabelX = totalsX;
    const totalsValueX = pageWidth - marginX;
    let ty = afterTableY;
    const totalLine = (label, value, bold) => {
      doc.setFont(undefined, bold ? 'bold' : 'normal');
      doc.text(label, totalsLabelX, ty);
      doc.text(value, totalsValueX, ty, { align: 'right' });
      ty += 5.5;
    };
    totalLine('SUB TOTAL', rp(subTotal));
    totalLine('DISCOUNT', (discount ? '-' : '') + rp(discount));
    totalLine('NET', rp(net));
    totalLine('PPN ' + (po.PpnPercent || 11) + '%', rp(ppn));
    doc.setDrawColor(0);
    doc.line(totalsLabelX, ty - 3, totalsValueX, ty - 3);
    totalLine('TOTAL', rp(total), true);
    doc.setFont(undefined, 'normal');

    // Tanda tangan
    const signY = Math.max(afterTableY + 45, ty + 25);
    doc.setFontSize(9);
    doc.text('Supplier', marginX, signY);
    doc.text('Authorized person,', 115, signY);
    doc.text('SIGNED :', marginX, signY + 12);
    doc.line(marginX + 18, signY + 12, marginX + 75, signY + 12);
    doc.text('NAME :', marginX, signY + 19);
    doc.line(marginX + 18, signY + 19, marginX + 75, signY + 19);
    doc.text('DATE :', marginX, signY + 26);
    doc.line(marginX + 18, signY + 26, marginX + 75, signY + 26);
    doc.text(po.AuthorizedPerson || '-', 115, signY + 19);

    doc.save(po.ID + '.pdf');
    showToast('PDF ' + po.ID + ' berhasil diunduh.');
  } catch (err) {
    showToast('Gagal membuat PDF: ' + (err.message || err), true);
  }
}
function fmtDateShort(d) {
  if (!d) return '-';
  const dt = new Date(d);
  if (isNaN(dt.getTime())) return d;
  const dd = String(dt.getDate()).padStart(2, '0');
  const mm = String(dt.getMonth() + 1).padStart(2, '0');
  const yy = String(dt.getFullYear()).slice(-2);
  return dd + '/' + mm + '/' + yy;
}

/* ================= PENERIMAAN GUDANG ================= */
function renderPenerimaanPage() {
  const rows = STATE.penerimaan.map((p) => {
    const itemsHtml = p.Items.map((it) => {
      const part = STATE.parts.find((x) => x.Kode === it.kode);
      return '<div class="tiny">' + (part ? escapeHtml(part.Nama) : it.kode) + ' · ' + it.qty + ' ' + (part ? escapeHtml(part.Satuan || '') : '') + '</div>';
    }).join('');
    return '<tr class="b-top"><td class="mono accent">' + p.ID + '</td><td class="mono muted">' + (p.PO || '-') + '</td>' +
      '<td class="fw-medium">' + escapeHtml(p.Supplier || '-') + '</td><td>' + fmtDate(p.Tanggal) + '</td><td>' + itemsHtml + '</td>' +
      '<td>' + statusDot(p.Status) + '</td><td>' + (p.Status === 'Menunggu'
        ? '<button class="btn btn-solid btn-sm" onclick="doTerimaPenerimaan(\'' + p.ID + '\')">' + ICONS.check + 'Konfirmasi Terima</button>'
        : '<span class="tiny muted">Selesai</span>') + '</td></tr>';
  }).join('');
  return '<div class="panel"><table class="table"><thead><tr>' +
    ['No. Penerimaan', 'No. PO', 'Supplier', 'Tanggal', 'Item', 'Status', ''].map((h) => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}
async function doTerimaPenerimaan(id) {
  try {
    const pgr = STATE.penerimaan.find((p) => p.ID === id);
    if (!pgr) throw new Error('Penerimaan tidak ditemukan.');
    let { error } = await sb.from('penerimaan').update({ status: 'Diterima' }).eq('id', id);
    if (error) throw error;
    if (pgr.PO) { ({ error } = await sb.from('purchase_orders').update({ status: 'Diterima' }).eq('id', pgr.PO)); if (error) throw error; }
    for (const it of pgr.Items) {
      const part = STATE.parts.find((p) => p.Kode === it.kode);
      const newStok = (part ? part.Stok : 0) + it.qty;
      ({ error } = await sb.from('parts').update({ stok: newStok }).eq('kode', it.kode));
      if (error) throw error;
      ({ error } = await sb.from('ledger').insert({ part_kode: it.kode, tanggal: todayStr(), tipe: 'Masuk', qty: it.qty, ref: pgr.PO || '-', saldo: newStok }));
      if (error) throw error;
    }
    await loadData();
    showToast('Penerimaan ' + id + ' dikonfirmasi. Stok telah diperbarui.');
  } catch (err) { showToast('Gagal: ' + (err.message || err), true); }
}
